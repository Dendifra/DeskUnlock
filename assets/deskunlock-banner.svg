<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">DeskUnlock</title>
  <desc id="desc">DeskUnlock smartphone authentication and proximity unlock for Linux</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.55" stop-color="#0a1d2e"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b62b9"/>
      <stop offset="1" stop-color="#102c68"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#18d2c4"/>
      <stop offset="1" stop-color="#087dc4"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#36c9ff"/>
      <stop offset="1" stop-color="#1787ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

