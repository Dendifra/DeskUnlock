# DeskUnlock — Continuous Integration.
#
# Runs the same gates a developer runs locally:
#   - `make lint` (clippy --all-targets -D warnings, fmt --check,
#                  cargo deny check, scope-discipline grep).
#   - `make test` (workspace, all targets, all features).
#   - `make build` (release; verifies `libpam_syauth.so` ships).
#
# System libraries the bluer / libpam-sys / libbluetooth-sys build
# scripts consume are installed from Arch repositories in every job.
# cargo caches are warmed by Swatinem/rust-cache.

name: ci

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint (clippy + fmt + deny + scope-discipline)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch CI dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup dbus pam bluez-libs python pyside6 pkgconf nodejs
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt --toolchain stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: make lint
        run: make lint

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch CI dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup dbus pam bluez-libs python pyside6 pkgconf nodejs
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: make test
        run: make test

  build:
    name: build (release workspace + cdylib)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch CI dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup dbus pam bluez-libs python pyside6 pkgconf nodejs
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: make build
        run: make build

      - name: Verify libpam_syauth.so exists
        run: test -f target/release/libpam_syauth.so

      - name: Verify syauth CLI exists
        run: test -x target/release/syauth

      - name: Verify syauth-presenced daemon exists
        run: test -x target/release/syauth-presenced

  # NOTE: the Android assembleDebug job depends on the Rust-built
  # `crates/syauth-mobile/target/syauth_mobile.aar` (UniFFI Kotlin
  # bindings + per-ABI `libsyauth_mobile.so`). Building that in CI
  # requires the NDK, the Android rustc targets and UniFFI tooling.
  # The desktop-side lint/test/build gates above cover the current
  # clean-machine workspace health check for DeskUnlock.
