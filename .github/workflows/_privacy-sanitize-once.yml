name: privacy-sanitize-once

on:
  push:
    branches:
      - security/privacy-hardening-20260928

permissions:
  contents: write

jobs:
  sanitize:
    if: ${{ !contains(github.event.head_commit.message, '[docs-sanitized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: security/privacy-hardening-20260928

      - name: Sanitize public documentation
        run: bash scripts/sanitize-public-docs.sh

      - name: Commit sanitized documentation
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name Dendifra
          git config user.email 99256531+Dendifra@users.noreply.github.com
          git add -- '*.md' '*.txt' '*.rst' '*.adoc'
          git diff --cached --check
          git commit -m 'privacy: sanitize public hardware evidence [docs-sanitized]'
          git push origin HEAD:security/privacy-hardening-20260928
