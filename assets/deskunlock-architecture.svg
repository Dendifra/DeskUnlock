<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">DeskUnlock architecture</title>
<desc id="desc">Android phone authenticates to the Linux desktop over BLE GATT using challenge-response, biometrics and PAM fallback.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0a1622"/><stop offset="1" stop-color="#0d2030"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#1ea7ff"/><stop offset="1" stop-color="#26d7c7"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3ff"/></marker>
</defs>
<rect width="1400" height="520" rx="26" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" fill="#edf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">How DeskUnlock works</text>
<text x="700" y="92" text-anchor="middle" fill="#8fa6b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Biometric confirmation on the phone, cryptographic verification on the desktop, normal PAM fallback when unavailable</text>

<g filter="url(#shadow)">
  <rect x="70" y="150" width="300" height="230" rx="22" fill="#10293d" stroke="#2b5876" stroke-width="2"/>
  <rect x="550" y="150" width="300" height="230" rx="22" fill="#10293d" stroke="#2b5876" stroke-width="2"/>
  <rect x="1030" y="150" width="300" height="230" rx="22" fill="#10293d" stroke="#2b5876" stroke-width="2"/>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="220" y="190" text-anchor="middle" fill="#f2f8fb" font-size="25" font-weight="700">Linux desktop</text>
  <text x="220" y="232" text-anchor="middle" fill="#7fcfff" font-size="20">PAM module</text>
  <text x="220" y="268" text-anchor="middle" fill="#c1d0db" font-size="17">Requests authentication</text>
  <text x="220" y="302" text-anchor="middle" fill="#c1d0db" font-size="17">Falls back to normal PAM chain</text>
  <rect x="143" y="330" width="154" height="34" rx="17" fill="#0a1d2b" stroke="#2b5876"/>
  <text x="220" y="353" text-anchor="middle" fill="#91a8b7" font-size="15">password / FIDO fallback</text>

  <text x="700" y="190" text-anchor="middle" fill="#f2f8fb" font-size="25" font-weight="700">DeskUnlock daemon</text>
  <text x="700" y="232" text-anchor="middle" fill="#7fcfff" font-size="20">Presence + challenge-response</text>
  <text x="700" y="268" text-anchor="middle" fill="#c1d0db" font-size="17">BLE / GATT transport</text>
  <text x="700" y="302" text-anchor="middle" fill="#c1d0db" font-size="17">Verifies Ed25519 response</text>
  <text x="700" y="336" text-anchor="middle" fill="#c1d0db" font-size="17">Tracks pairing and proximity state</text>

  <text x="1180" y="190" text-anchor="middle" fill="#f2f8fb" font-size="25" font-weight="700">Android phone</text>
  <text x="1180" y="232" text-anchor="middle" fill="#7fcfff" font-size="20">Biometric confirmation</text>
  <text x="1180" y="268" text-anchor="middle" fill="#c1d0db" font-size="17">Keystore-backed private key</text>
  <text x="1180" y="302" text-anchor="middle" fill="#c1d0db" font-size="17">Signs the desktop challenge</text>
  <rect x="1107" y="330" width="146" height="34" rx="17" fill="#0a1d2b" stroke="#2b5876"/>
  <text x="1180" y="353" text-anchor="middle" fill="#91a8b7" font-size="15">user-approved unlock</text>
</g>

<line x1="370" y1="230" x2="550" y2="230" stroke="#4fc3ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="460" y="214" text-anchor="middle" fill="#75cfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">auth request</text>
<line x1="850" y1="230" x2="1030" y2="230" stroke="#4fc3ff" stroke-width="3" marker-end="url(#arrow)"/>
<text x="940" y="214" text-anchor="middle" fill="#75cfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">challenge</text>
<line x1="1030" y1="305" x2="850" y2="305" stroke="#26d7c7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="940" y="330" text-anchor="middle" fill="#71dfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">signed response</text>
<line x1="550" y1="305" x2="370" y2="305" stroke="#26d7c7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="460" y="330" text-anchor="middle" fill="#71dfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">verified result</text>

<g transform="translate(650 420)">
  <rect width="100" height="44" rx="22" fill="url(#blue)" opacity=".18" stroke="#2cbfe5"/>
  <circle cx="24" cy="22" r="7" fill="#29d2c5"/>
  <text x="42" y="28" fill="#b7c9d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Fail-safe</text>
</g>
</svg>